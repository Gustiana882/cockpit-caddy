# Build and publish a source archive and Debian package for each version tag.
name: release
on:
  push:
    tags:
      # this is a glob, not a regexp
      - '[0-9]*'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # create GitHub release
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext nodejs npm make

      - name: Build source archive
        run: make VERSION="${GITHUB_REF_NAME}" dist

      - name: Build Debian package
        run: sh packaging/debian/build-deb "${GITHUB_REF_NAME}"

      - name: Create or update release assets
        run: |
          set -x

          TAG_VERSION="${GITHUB_REF_NAME}"
          SOURCE_ARCHIVE="cockpit-caddy-${TAG_VERSION}.tar.xz"
          DEB_PACKAGE="cockpit-caddy_${TAG_VERSION}_all.deb"
          if [ ! -f "${SOURCE_ARCHIVE}" ]; then
            echo "Expected source archive not found: ${SOURCE_ARCHIVE}" >&2
            exit 1
          fi
          git tag -l --format='%(contents:body)' "${TAG_VERSION}" > release-note.txt

          if gh release view "${TAG_VERSION}" >/dev/null 2>&1; then
            gh release upload "${TAG_VERSION}" "${SOURCE_ARCHIVE}" "${DEB_PACKAGE}" --clobber
          else
            gh release create --title "${TAG_VERSION}" --notes-file release-note.txt \
              "${TAG_VERSION}" \
              "${SOURCE_ARCHIVE}" \
              "${DEB_PACKAGE}"
          fi
