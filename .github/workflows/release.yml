# Build and publish a source archive and Debian package for each version tag.
name: release
on:
  push:
    tags:
      # this is a glob, not a regexp
      - '[0-9]*'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # create GitHub release
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext nodejs npm make

      - name: Build source archive
        run: make dist

      - name: Build Debian package
        run: sh packaging/debian/build-deb "${GITHUB_REF_NAME}"

      - name: Create a release
        run: |
          set -x

          TAG_VERSION="$(git describe --tags)"
          git tag -l --format='%(contents:body)' ${TAG_VERSION} > release-note.txt
          SOURCE_ARCHIVE="$(find . -maxdepth 1 -type f -name 'cockpit-*.tar.xz' -print -quit)"
          if [ -z "${SOURCE_ARCHIVE}" ]; then
            echo "No source archive produced by 'make dist'" >&2
            exit 1
          fi

          gh release create --title ${TAG_VERSION} --notes-file release-note.txt  \
            ${TAG_VERSION} \
            "${SOURCE_ARCHIVE}" \
            cockpit-caddy_${TAG_VERSION}_all.deb
